name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── Windows (self-hosted, requires VS 2022 + vcpkg) ─────────────
  # MSBuild discovers vcpkg via %VCPKG_ROOT% (already exported on the
  # runner, pointing at the unshallowed clone). The runner must have
  # the MSBuild vcpkg integration set up.
  build-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      # Capture VCPKG_ROOT from the system env before msvc-dev-cmd
      # overwrites it with the VS-bundled vcpkg (which is stale and
      # can't download its MSYS2 tools).
      - name: Get VCPKG_ROOT
        id: vcpkg-root
        shell: pwsh
        run: echo "value=$env:VCPKG_ROOT" >> $env:GITHUB_OUTPUT

      # The runner has both VS 2022 (v143) and VS 2026 (v145). The project
      # deliberately pins v143, so force the VS 2022 install; otherwise the
      # action defaults to the newest version and fails MSB8052.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          vsversion: "2022"

      # Write .user.props pointing at the user's vcpkg clone (not the
      # VS-bundled one). MSBuild reads this to auto-install manifest deps.
      - name: Set up vcpkg MSBuild integration
        shell: cmd
        run: |
          "%VCPKG_ROOT%\vcpkg.exe" integrate install
        env:
          VCPKG_ROOT: ${{ steps.vcpkg-root.outputs.value }}

      - name: Build x86 (Win32) release
        shell: cmd
        env:
          VCPKG_ROOT: ${{ steps.vcpkg-root.outputs.value }}
        run: msbuild EdgeViewer.sln /t:Build /p:Configuration=Release;Platform=Win32;UseEnv=true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Build x64 release
        shell: cmd
        env:
          VCPKG_ROOT: ${{ steps.vcpkg-root.outputs.value }}
        run: msbuild EdgeViewer.sln /t:Build /p:Configuration=Release;Platform=x64;UseEnv=true

      # Copy with PowerShell cmdlets, not robocopy: robocopy returns exit
      # code 1 on "files copied" which the runner's pwsh wrapper treats as a
      # step failure (`exit $LASTEXITCODE`) even though the copy succeeded.
      - name: Package
        shell: pwsh
        run: |
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          Copy-Item Resources\* dist\release -Recurse -Force
          Copy-Item winbuild\EdgeViewer_Win32_Release\EdgeViewer-Win32.dll dist\release\EdgeViewer.wlx
          Copy-Item winbuild\EdgeViewer_x64_Release\EdgeViewer-x64.dll dist\release\EdgeViewer.wlx64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/release/

  # ── Linux (GitHub-hosted ubuntu) ─────────────────────────────────
  # ubuntu-24.04's apt qt6-webengine-dev is Qt 6.4.2, too old. The
  # backend needs QWebEnginePage::zoomFactorChanged (public signal since
  # Qt 6.8) plus QStyleHints::colorScheme, setAdditionalResponseHeaders
  # and FetchApiAllowed (>= 6.6). Install the Qt 6.8 LTS from the
  # official Qt repos via aqtinstall and point CMake at it with
  # CMAKE_PREFIX_PATH.
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt 6.8.3 (linux desktop)
        run: |
          pip install aqtinstall
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 \
            -m qtwebengine qtwebchannel qtpositioning qt5compat -O "$HOME/Qt"

      - name: Build release
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.8.3/gcc_64"
          cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/linux-release
          cp build/EdgeViewer.wlx64 dist/linux-release/
          cp -r Resources/assets dist/linux-release/
          cp Resources/edgeviewer.ini dist/linux-release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux-release/

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release zips
        run: |
          cd artifacts
          cd windows-binaries
          zip -r ../../edge-viewer-Windows.zip .
          cd ../linux-binaries
          zip -r ../../edge-viewer-Linux.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/edge-viewer-Windows.zip
            artifacts/edge-viewer-Linux.zip
