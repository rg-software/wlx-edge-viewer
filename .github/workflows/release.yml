name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── Windows (self-hosted, requires VS 2022 + vcpkg) ─────────────
  # MSBuild discovers vcpkg via %VCPKG_ROOT% (already exported on the
  # runner, pointing at the unshallowed clone). The runner must have
  # the MSBuild vcpkg integration set up.
  build-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      # The runner has both VS 2022 (v143) and VS 2026 (v145). The project
      # deliberately pins v143, so force the VS 2022 install; otherwise the
      # action defaults to the newest version and fails MSB8052.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
          vsversion: "2022"

      # vcvarsall puts vcpkg on PATH and sets VCPKG_ROOT. Running
      # integrate install writes the .user.props so MSBuild auto-installs
      # manifest deps (mini/ini.h, wil, catch2) during the build.
      - name: Set up vcpkg MSBuild integration
        shell: cmd
        run: vcpkg integrate install

      - name: Build x86 (Win32) release
        shell: cmd
        run: msbuild EdgeViewer.sln /t:Build /p:Configuration=Release;Platform=Win32;UseEnv=true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Build x64 release
        shell: cmd
        run: msbuild EdgeViewer.sln /t:Build /p:Configuration=Release;Platform=x64;UseEnv=true

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release
          robocopy Resources dist\release /E /XD dist | Out-Null
          Copy-Item winbuild\EdgeViewer_Win32_Release\EdgeViewer-Win32.dll dist\release\EdgeViewer.wlx
          Copy-Item winbuild\EdgeViewer_x64_Release\EdgeViewer-x64.dll dist\release\EdgeViewer.wlx64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/release/

  # ── Linux (GitHub-hosted ubuntu) ─────────────────────────────────
  # ubuntu-24.04's apt qt6-webengine-dev is Qt 6.4.2, too old for the
  # loaders/backend (needs Qt >= 6.6: QStyleHints::colorScheme,
  # setAdditionalResponseHeaders, FetchApiAllowed, zoomFactorChanged).
  # Install Qt 6.6.3 (matches the local baseline) from the official Qt
  # repos via aqtinstall and point CMake at it with CMAKE_PREFIX_PATH.
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Qt 6.6.3 (linux desktop)
        run: |
          pip install aqtinstall
          python -m aqt install-qt linux desktop 6.6.3 gcc_64 \
            -m qtwebengine qt5compat -O "$HOME/Qt"

      - name: Build release
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.6.3/gcc_64"
          cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/linux-release
          cp build/EdgeViewer.wlx64 dist/linux-release/
          cp -r Resources/assets dist/linux-release/
          cp Resources/edgeviewer.ini dist/linux-release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux-release/

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release zips
        run: |
          cd artifacts
          cd windows-binaries
          zip -r ../../edge-viewer-Windows.zip .
          cd ../linux-binaries
          zip -r ../../edge-viewer-Linux.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/edge-viewer-Windows.zip
            artifacts/edge-viewer-Linux.zip
