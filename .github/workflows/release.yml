name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── Windows (self-hosted, requires VS 2022 + vcpkg) ─────────────
  # MSBuild discovers vcpkg via %VCPKG_ROOT%; the runner must have the
  # MSBuild vcpkg MSBuild integration set up (or VCPKG_ROOT exported).
  build-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86 (Win32) release
        shell: cmd
        run: msbuild EdgeViewer.sln /t:Build /p:Configuration=Release;Platform=Win32;UseEnv=true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 release
        shell: cmd
        run: msbuild EdgeViewer.sln /t:Build /p:Configuration=Release;Platform=x64;UseEnv=true

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release
          robocopy Resources dist\release /E /XD dist | Out-Null
          Copy-Item winbuild\EdgeViewer_Win32_Release\EdgeViewer-Win32.dll dist\release\EdgeViewer.wlx
          Copy-Item winbuild\EdgeViewer_x64_Release\EdgeViewer-x64.dll dist\release\EdgeViewer.wlx64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/release/

  # ── Linux (GitHub-hosted ubuntu) ─────────────────────────────────
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config \
            qt6-base-dev qt6-webengine-dev

      - name: Build release
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Package
        run: |
          mkdir -p dist/linux-release
          cp build/EdgeViewer.wlx64 dist/linux-release/
          cp -r Resources/assets dist/linux-release/
          cp Resources/edgeviewer.ini dist/linux-release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux-release/

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package release zips
        run: |
          cd artifacts
          cd windows-binaries
          zip -r ../../edge-viewer-Windows.zip .
          cd ../linux-binaries
          zip -r ../../edge-viewer-Linux.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/edge-viewer-Windows.zip
            artifacts/edge-viewer-Linux.zip
