<html>
  <head>
	  <meta charset="utf-8"/>
	  <base href=http://local.example/__BASE_URL__/>
    <link rel="stylesheet" href="http://assets.example/markdown/__CSS_NAME__">
    <link rel="stylesheet" href="http://assets.example/highlight_js/github.min.css">
    <link rel="stylesheet" href="http://assets.example/markdown/github.markdown.alert.css">
    <script src="http://assets.example/detect-charset.js"></script>
    <script src="http://assets.example/markdown/marked.umd.js"></script>
    <script src="http://assets.example/markdown/markdownExtension.js"></script>
    <script src="http://assets.example/highlight_js/highlight.min.js"></script>
    <script src="http://assets.example/mermaid/mermaid.min.js"></script>
    <script src="http://assets.example/mathjax/tex-svg.js"></script>
  </head>
  <body>
    <div id="content"></div>
    
    <script>window.__MD_NAVIGATION__ = __MD_NAV_FLAG__;</script>
    <script>
      // The plugin pre-fetches the file and base64-encodes it. The
      // inlined value is a base64 string literal (RFC 4648 charset is
      // safe inside the quotes). Falls back to fetch() for builds that
      // don't pre-fetch.
      const fileContent = "__FILE_CONTENT__";
      const getBytes = fileContent
        ? Promise.resolve(Uint8Array.from(atob(fileContent), c => c.charCodeAt(0)))
        : fetch("http://local.example/__MD_FILENAME__").then(r => r.arrayBuffer());

      getBytes.then(async t =>
        {
          const decoder = new TextDecoder(detect_charset(new Uint8Array(t)));

          marked.use({
            extensions: [markdownAlertExtension],
            renderer: customRenderer
          });

          // remove YAML frontmatter (must start at the very beginning of the file)
          const htmlWithoutYaml = decoder.decode(t).replace(/^---\r?\n[\s\S]*?\n---\r?\n?/, '');
          document.getElementById('content').innerHTML = marked.parse(htmlWithoutYaml);

          // ---- MathJax----
          try {
              MathJax.typeset();
          } catch(e) {
              console.log("MathJax error:", e);
          }

          // ---- Mermaid ----
          try {
              mermaid.initialize({ startOnLoad: false });
              await mermaid.run();
          } catch(e) {
              console.log("Mermaid error:", e);
          }

          // ---- highlight.js ----
          try {
              hljs.highlightAll();
          } catch(e) {
              console.log("highlight.js error:", e);
          }

          if (window.__MD_NAVIGATION__) _mdPushNav(document.baseURI + "__MD_FILENAME__".split('/').pop());
        });
    </script>
  </body>
</html>
