<html>
  <head>
    <script src="http://assets.example/mhtml/mhtml2html.min.js"></script>
    <script src="http://assets.example/charset/singlebyte.js"></script>
  </head>
  <body>
    <div id="content"></div>
    <script>
      // The plugin pre-fetches the file and base64-encodes it. The
      // inlined value is a base64 string literal (RFC 4648 charset is
      // safe inside the quotes). Falls back to fetch() for builds that
      // don't pre-fetch.
      const fileContent = "__FILE_CONTENT__";
      const getBytes = fileContent
        ? Promise.resolve(Uint8Array.from(atob(fileContent), c => c.charCodeAt(0)))
        : fetch("http://local.example/__MHTML_FILENAME__")
            .then(r => r.arrayBuffer())
            .then(b => new Uint8Array(b));

      let rawBytes = null;

      const toByteString = bytes =>
        Array.from(bytes, b => String.fromCharCode(b)).join('');

      // Re-encode the text/html part's payload to genuine UTF-8 (8-bit body,
      // charset=utf-8). Qt Web Engine cannot render an mhtml2html decode-success
      // body for legacy single-byte charsets — the decoded HTML turns into an
      // empty <body> — so instead of letting mhtml2html decode with the legacy
      // code page (its TextDecoder), we decode page-side and re-emit the part
      // as raw UTF-8 bytes. mhtml2html then takes its native UTF-8 path, which
      // renders correctly on both Qt Web Engine and WebView2.
      const reencodePartToUtf8 = (src, tag) => {
        const rebuild = (head, body) => {
          const te = head.match(/content-transfer-encoding\s*:\s*([^\s;,\r\n]+)/i);
          const enc = te ? te[1].trim().toLowerCase() : '';
          let payload;
          try {
            const d = transferDecode(body, enc);
            payload = enc === 'base64' ? atob(d) : d;
          } catch (e) { return null; }
          const bytes = Uint8Array.from(payload, c => c.charCodeAt(0));
          let text;
          try { text = window.__evTextDecode(tag, bytes, false); } catch (e) { return null; }
          const u8 = new TextEncoder().encode(text);
          const raw = Array.from(u8, b => String.fromCharCode(b)).join('');
          let newHead = head
            .replace(/charset\s*=\s*"?[^";\s]+"?/gi, 'charset="utf-8"')
            .replace(/content-transfer-encoding\s*:\s*[^\s;,\r\n]+/gi, 'Content-Transfer-Encoding: 8bit');
          if (!/content-transfer-encoding/i.test(newHead)) newHead += '\r\nContent-Transfer-Encoding: 8bit';
          return newHead + '\r\n\r\n' + raw;
        };
        const bm = src.match(/content-type\s*:\s*(?:multipart\/[\w-]+|message\/rfc822)[^]*?;\s*boundary\s*=\s*"?([^";\s]+)"?/i);
        if (bm) {
          const sep = '--' + bm[1];
          const parts = src.split(sep);
          let done = false;
          for (let k = 1; k < parts.length && !done; k++) {
            const hb = /\r?\n\r?\n/.exec(parts[k]);
            if (!hb) continue;
            if (/content-type\s*:\s*text\/html/i.test(parts[k].slice(0, hb.index))) {
              const rebuilt = rebuild(parts[k].slice(0, hb.index), parts[k].slice(hb.index + hb[0].length));
              if (rebuilt !== null) { parts[k] = rebuilt; done = true; }
            }
          }
          if (done) return parts.join(sep);
          return src;
        }
        // single-part MHT: top-level headers then the raw body
        const hb = /\r?\n\r?\n/.exec(src);
        if (hb && /content-type\s*:\s*text\/html/i.test(src.slice(0, hb.index))) {
          const rebuilt = rebuild(src.slice(0, hb.index), src.slice(hb.index + hb[0].length));
          if (rebuilt !== null) return rebuilt;
        }
        return src;
      };

      const convertWithForcedCharset = (bytes, tag) => {
        let src = toByteString(bytes);
        src = reencodePartToUtf8(src, tag);
        // Also force any in-document <meta charset> / http-equiv so
        // mhtml2html and the final document agree on utf-8.
        src = src.replace(
          /(<meta[^>]+charset\s*=\s*['"]?)[^"'\s>;]+/gi, '$1utf-8');
        src = src.replace(
          /(<meta[^>]+http-equiv\s*=\s*['"]?content-type[^>]*?charset\s*=\s*['"]?)[^"'\s>;]+/gi,
          '$1utf-8');
        return mhtml2html.convert(src);
      };

      const render = (bytes, forcedTag) => {
        const h = forcedTag
          ? convertWithForcedCharset(bytes, forcedTag)
          : mhtml2html.convert(toByteString(bytes));
        const e = h.window.document.documentElement;
        document.getElementById('content').innerHTML = e.innerHTML;
      };

      const notifyError = (msg) => {
        let t = document.getElementById('ev-encoding-toast');
        if (!t) {
          t = document.createElement('div');
          t.id = 'ev-encoding-toast';
          t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;font:12px system-ui,sans-serif;padding:8px 14px;border-radius:6px;z-index:2147483647';
          (document.body || document.documentElement).appendChild(t);
        }
        t.textContent = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2600);
      };

      // Executor invoked by the host-side native Encoding submenu
      // (ExecuteScript / runJavaScript with a tag or null for auto).
      window.__evEncodingApply = (tag) => {
        if (!rawBytes)
          return;
        try {
          render(rawBytes, tag);
        } catch (err) {
          notifyError('Cannot re-decode with this encoding.');
          // This pick could not be applied. The host optimistically marked the
          // chosen code page as active (its Encoding-menu radio). Tell it to
          // hand the view back to auto-detection, then re-run our detection so
          // the fresh report restores the "Auto: <codepage>" hint instead of a
          // bare "Auto-detect". The document itself was NOT re-rendered (the
          // render above threw), so we keep showing the previous bytes.
          window.__evMhtAutoDetectDone = false;
          runMhtAutoDetect(true);
          post('CMD_ENCODING_APPLY_FAILED');
          return;
        }
        // Null tag = the user reselected "Auto-detect" in the Encoding
        // submenu (host ApplicationCharsetOverride sends __evEncodingApply(null)
        // and has already reset its own latches). Mirrors the HTML path
        // (re-navigate -> engine re-sniff -> auto-detect re-fires): reset this
        // one-shot latch and re-run MHT detection over the fresh render so the
        // detected tag is re-applied (or the "Auto: <codepage>" hint refreshed).
        if (tag === null) {
          window.__evMhtAutoDetectDone = false;
          runMhtAutoDetect(true);
        }
      };

      // --- MHT auto-detect (charset-autodetect for MHT) ---
      // The HTML detector (autodetect.js) only ever sees the raw MIME
      // envelope, whose payload is quoted-printable/base64-encoded — the
      // real text bytes never exist in the file. So MHT detection runs
      // HERE: transfer-decode the chosen text part back to bytes and run
      // jschardet over those pristine payload bytes, mirroring what
      // autodetect.js does for HTML. Disagreement posts CMD_AUTO_ENCODING
      // so the host provisionally re-renders page-side via
      // __evEncodingApply (same machinery as a manual menu pick).
      const TAG_NORMALIZE = {
        'utf-8': 'utf-8', 'utf8': 'utf-8',
        'windows-1252': 'windows-1252', 'iso-8859-1': 'windows-1252',
        'iso-8859-15': 'iso-8859-15', 'windows-1250': 'windows-1250',
        'iso-8859-2': 'iso-8859-2', 'windows-1251': 'windows-1251',
        'koi8-r': 'koi8-r', 'x-mac-cyrillic': 'windows-1251',
        'iso-8859-5': 'iso-8859-5', 'windows-1253': 'windows-1253',
        'windows-1254': 'windows-1254', 'windows-1255': 'windows-1255',
        'windows-1256': 'windows-1256', 'windows-1257': 'windows-1257',
        'windows-1258': 'windows-1258', 'windows-874': 'windows-874',
        'shift_jis': 'shift_jis', 'shift-jis': 'shift_jis',
        'euc-jp': 'euc-jp', 'gbk': 'gbk', 'gb2312': 'gb2312',
        'big5': 'big5', 'euc-kr': 'euc-kr'
      };
      const normalizeMhtName = n => TAG_NORMALIZE[String(n).toLowerCase()] || null;

// Pick the text part whose pristine payload should feed the detector:
// the first text/html part, else the largest text/* part. Returns
// { body (raw encoded body), enc (transfer encoding), declared } or
// null when there is no text part to detect.
const extractTextPart = (src) => {
  const bm = src.match(
    /content-type\s*:\s*(?:multipart\/[\w-]+|message\/rfc822)[^]*?;\s*boundary\s*=\s*"?([^";\s]+)"?/i
  );
  if (!bm) return null;
  const candidates = [];
  for (const sec of src.split('--' + bm[1]).slice(1)) {
    const sep = /\r?\n\r?\n/.exec(sec);
    if (!sep) continue;
    const head = sec.slice(0, sep.index);
    const body = sec.slice(sep.index + sep[0].length);
    const ct = head.match(/content-type\s*:\s*([^;\r\n]+)/i);
    const type = ct ? ct[1].trim().toLowerCase() : '';
    if (!/^text\//.test(type)) continue;
    const cs = head.match(/charset\s*=\s*"?([^";\s]+)"?/i);
    const declared = cs ? cs[1].trim() : '';
    const te = head.match(/content-transfer-encoding\s*:\s*([^\s;,\r\n]+)/i);
    const enc = te ? te[1].trim().toLowerCase() : '';
    candidates.push({ body, type, declared, enc });
  }
  if (!candidates.length) return null;
  const html = candidates.find(c => /html/.test(c.type));
  if (html) return html;
  return candidates.reduce((a, b) => (b.body.length > a.body.length ? b : a));
};

      // Undo the part's Content-Transfer-Encoding so the payload is the
      // pristine bytes again. Returns a base64 string for 'base64' (atob'd
      // by the caller) or a binary string (1 char = 1 byte) otherwise.
      const transferDecode = (body, enc) => {
        let b = body.replace(/\r?\n$/, '');   // CRLF before the next boundary
        if (enc === 'quoted-printable')
          return b
            .replace(/=\r?\n/g, '')            // soft line breaks
            .replace(/=([0-9A-F]{2})/gi, (m, h) => String.fromCharCode(parseInt(h, 16)));
        return b.replace(/\s+/g, '');          // base64: drop interior whitespace
      };

      const loadScript = (src) => new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        (document.head || document.documentElement).appendChild(s);
      });

      const post = (msg) => {
        try {
          if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage)
            window.chrome.webview.postMessage(msg);
        } catch (e) {}
      };

      const detectAndPost = (bin, declared, applyOnDisagree) => {
        const declaredTag = normalizeMhtName(declared);
        let res;
        try { res = window.jschardet.detect(bin); } catch (e) { return null; }
        if (!res || !res.encoding) return null;
        if (typeof res.confidence === 'number' && res.confidence < 0.90) return null;
        const detected = normalizeMhtName(res.encoding);
        if (!detected) return null;

        // The declared charset is authoritative IF it actually encodes the
        // payload without error (the engine decoded it cleanly — a genuine
        // declared file, never second-guess it). A wrong declaration (e.g.
        // "utf-8" on Windows-1251 bytes) throws, leaving the detected tag
        // in charge.
        let declaredFits = false;
        if (declaredTag) {
          try {
            const buf = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            window.__evTextDecode(declaredTag, buf, true);
            declaredFits = true;
          } catch (e) { declaredFits = false; }
        }

        const label = declaredFits ? declaredTag : detected;
        if (declaredFits || detected === declaredTag) {
          // Engine (loader) decoded it correctly: no re-render, but surface
          // the resolved charset so the menu shows "Auto: <codepage>".
          post('CMD_AUTO_ENCODING_REPORT|' + label);
          return { label: label };
        }
        // Disagreement: one provisional correction request to the host,
        // which re-renders page-side with the detected tag. The explicit
        // re-pick handles the re-render itself instead.
        if (applyOnDisagree)
          post('CMD_AUTO_ENCODING|' + detected);
        return { label: label };
      };

      const runMhtAutoDetect = (forceApply) => {
        if ((window.__evMhtAutoDetectDone && !forceApply) || !rawBytes) return;
        window.__evMhtAutoDetectDone = true;
        const part = extractTextPart(toByteString(rawBytes));
        if (!part) return;
        let bin;
        try {
          const decoded = transferDecode(part.body, part.enc);
          bin = part.enc === 'base64' ? atob(decoded) : decoded;
        } catch (e) { return; }
        if (!bin || !bin.length) return;
        let hasNonAscii = false;
        for (let i = 0; i < bin.length; i++) {
          if (bin.charCodeAt(i) >= 0x80) { hasNonAscii = true; break; }
        }
        if (!hasNonAscii) return; // pure ASCII: nothing to detect
        loadScript('http://assets.example/charset/jschardet.min.js')
          .then(() => {
            const outcome = detectAndPost(bin, part.declared, !forceApply);
            if (forceApply && outcome && outcome.label) {
              // Restore the view to the resolved charset: after a manual pick
              // that mangled the display, "Auto-detect" must re-render, not
              // just surface a hint.
              try { render(rawBytes, outcome.label); } catch (e) { notifyError('Cannot re-decode with this encoding.'); }
            }
          })
          .catch(() => {});
      };

      getBytes.then(buf =>
        {
          rawBytes = buf;
          try {
            render(rawBytes, null);
          } catch (err) {
            notifyError('Error rendering this MHT file.');
          }
          runMhtAutoDetect(false);
        })
        .catch(() => {
          document.getElementById('content').textContent = 'Error loading file.';
        });
    </script>
  </body>
</html>
