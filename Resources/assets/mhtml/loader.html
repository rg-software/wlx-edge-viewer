<html>
  <head>
    <script src="http://assets.example/mhtml/mhtml2html.min.js"></script>
  </head>
  <body>
    <div id="content"></div>
    <script>
      // The plugin pre-fetches the file and base64-encodes it. We
      // read the inlined value via window["..."] (bracket notation) so
      // that any trailing '=' from base64 padding isn't parsed as an
      // assignment operator after the property name. Falls back to
      // fetch() for builds that don't pre-fetch.
      const fileContent = window["__FILE_CONTENT__"];
      const getText = fileContent
        ? Promise.resolve(atob(fileContent))
        : fetch("http://local.example/__MHTML_FILENAME__").then(r => r.text());

      getText.then(t =>
        {
          const h = mhtml2html.convert(t);
          const e = h.window.document.documentElement;
          document.getElementById('content').innerHTML = e.innerHTML;
        });
    </script>
  </body>
</html>
