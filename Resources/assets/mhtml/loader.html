<html>
  <head>
    <script src="http://assets.example/mhtml/mhtml2html.min.js"></script>
  </head>
  <body>
    <div id="content"></div>
    <script>
      // __FILE_CONTENT__ is set by the plugin (base64-encoded) when
      // it pre-fetches the file content. Falls back to fetch() for
      // the old plugin flow (no pre-fetch).
      const getText = window.__FILE_CONTENT__
        ? Promise.resolve(atob(window.__FILE_CONTENT__))
        : fetch("http://local.example/__MHTML_FILENAME__").then(r => r.text());

      getText.then(t =>
        {
          const h = mhtml2html.convert(t);
          const e = h.window.document.documentElement;
          document.getElementById('content').innerHTML = e.innerHTML;
        });
    </script>
  </body>
</html>
