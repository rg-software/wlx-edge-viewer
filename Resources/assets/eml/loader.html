<html>
  <head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="http://assets.example/eml/__CSS_NAME__">
    <script src="http://assets.example/eml/postal-mime.min.js"></script>
    <script src="http://assets.example/eml/eml.js"></script>
  </head>
  <body>
    <div id="content"></div>
    <script>
      // The plugin pre-fetches the file and base64-encodes it. We
      // read the inlined value via window["..."] (bracket notation) so
      // that any trailing '=' from base64 padding isn't parsed as an
      // assignment operator after the property name. Falls back to
      // fetch() for builds that don't pre-fetch.
      const fileContent = window["__FILE_CONTENT__"];
      const getBytes = fileContent
        ? Promise.resolve(Uint8Array.from(atob(fileContent), c => c.charCodeAt(0)))
        : fetch("http://local.example/__EML_FILENAME__").then(r => r.arrayBuffer());

      getBytes.then(async buf => {
        try {
          const email = await PostalMime.parse(buf);
          const empty = !email.html && !email.text && !email.subject &&
                        !email.from && !email.date &&
                        !(email.attachments && email.attachments.length);
          if (empty) {
            emlRenderer.renderRawText(new TextDecoder("utf-8").decode(buf));
          } else {
            emlRenderer.renderEmail(email);
          }
        } catch (e) {
          try {
            emlRenderer.renderRawText(new TextDecoder("utf-8").decode(buf));
          } catch (e2) {
            document.getElementById("content").textContent = "Unable to render this .eml file.";
          }
        }
      }).catch(() => {
        document.getElementById("content").textContent = "Error loading file.";
      });
    </script>
  </body>
</html>
